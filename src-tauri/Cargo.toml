[package]
name = "ssheesh"
version = "0.8.1"
description = "SSHeesh — servers, terminals and files that don't fall over"
edition = "2021"
license = "CC-BY-NC-SA-4.0"

[lib]
name = "ssheesh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
sshee-core = { path = "../crates/sshee-core" }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

# Snap Layouts for the custom title bar's maximize button.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }
