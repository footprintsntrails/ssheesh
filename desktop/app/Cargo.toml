[package]
name = "ssheesh-preview"
version = "1.0.0-canary"
description = "SSHeesh Preview: the 1.0 window on Rune, beside the released app"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ssheesh-preview"
path = "src/main.rs"

[dependencies]
# Rune only through sshee-ui.
sshee-ui.workspace = true
sshee-core.workspace = true
sshee-term.workspace = true
sshee-app.workspace = true
# System notifications whose click comes back, and the tray (no Rune: `desktop.rs` joins it to
# the window).
sshee-desktop.workspace = true
# The demo's fixtures.
serde_json = "1"
# Where 0.10 kept its server list, and the Downloads folder.
dirs = "6"
# This computer's distance from UTC, for the dates in Files (the version sshee-core's
# dependencies already lock).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Each server's colour by its key, in the order sshee-app lists them (the version it uses).
indexmap = "2"
# Updating itself (`update`): canary.json, update-v1.json and the archives over HTTPS (rustls
# with ring and the web's roots, as sshee-core's Tor already builds it), the archive's SHA-256
# and minisign signature (the checker Tauri's updater uses), and the program out of a tar.gz
# or a zip (the versions sshee-core already locks).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-root-certs = "1"
sha2 = "0.10"
minisign-verify = "0.3"
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Releases (`update-v1.json`) compare by semver precedence (the version the lock already has).
semver = "1"
# A server's picture: a file made into a small PNG icon, and the icon decoded for the window
# (the version and decoders Rune already locks). TIFF too: turned on here, Rune's own decoder
# reads it as well, so Files shows a .tif (the version of `tiff` the lock already has).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }

# Windows: the installer (`setup`): the registry under HKCU, the Start menu's shortcuts with
# their AppUserModelID, its mutex (the versions and features Rune already builds).
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }

# Taking macOS's quarantine mark off a staged build (`update::swap`).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Windows: the icon, version and manifest compiled into the program (`build.rs`; the version
# the root workspace already locks).
[build-dependencies]
embed-resource = "3"

[dev-dependencies]
# Signing made-up archives as minisign does, with keys made in the tests (`update::verify`);
# folders of made-up programs (`update::swap`).
ed25519-dalek = "2"
blake2 = "0.10"
tempfile = "3"
# The headless snapshots, decoded to compare colours; the scripts and trees are JSON.
png = "0.18"
