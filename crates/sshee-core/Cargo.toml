[package]
name = "sshee-core"
version = "0.10.3"
edition = "2021"
license = "CC-BY-NC-SA-4.0"
description = "Connections, durable SSH sessions, remote files and metrics for SSHeesh"

[dependencies]
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
# Office files are zips; cleaned ones are written back in pure Rust.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Tor inside the app: Arti, the Tor Project's own Tor in Rust.
arti-client = { version = "0.47", default-features = false, features = ["tokio", "rustls", "compression", "static-sqlite", "onion-service-client"] }
tor-rtcompat = { version = "0.47", default-features = false, features = ["tokio", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
getrandom = "0.3"
# The door's proofs (SHA-256), from the TLS library Tor already uses.
ring = "0.17"
# Reads the clock skew Tor reports ("2days 23h 59m").
humantime = "2"
# Tor's own account of what it's doing, in a file you can send when it won't start.
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
