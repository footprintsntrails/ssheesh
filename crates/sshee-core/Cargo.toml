[package]
name = "sshee-core"
version = "0.9.0"
edition = "2021"
license = "CC-BY-NC-SA-4.0"
description = "Connections, durable SSH sessions, remote files and metrics for SSHeesh"

[dependencies]
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
# Office files are zips; cleaned ones are written back in pure Rust.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
