name: Bug report
description: Something doesn't work the way it should
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a terminal to a server
        2. Turn Wi-Fi off for 10 seconds
        3. …
  - type: input
    id: version
    attributes:
      label: SSHeesh version
      description: Settings → About
      placeholder: "0.3.4"
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Your computer
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Linux
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server system
      description: What you connect to, if it matters.
      placeholder: Ubuntu 24.04, tmux 3.4
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or error messages
