name: Feature request
description: Suggest something SSHeesh should do
title: "Feature: "
labels: ["feature request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Describe the problem first, then the solution you have in mind.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in your way today.
      placeholder: When I restart a container I have to open a terminal and type…
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would help?
      description: How you imagine it working in SSHeesh. Screenshots or sketches are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it now?
      description: Other tools or workarounds you use.
  - type: dropdown
    id: system
    attributes:
      label: Your computer
      options:
        - macOS
        - Windows
        - Linux
