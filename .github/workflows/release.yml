# Builds SSHeesh for macOS, Windows and Linux and publishes a GitHub release.
# Runs when a version tag is pushed (git tag v0.1.1 && git push --tags),
# or by hand from the Actions tab.
#
# Needs two repository secrets for signed auto-updates:
#   TAURI_SIGNING_PRIVATE_KEY           contents of the private key file
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v7
      - id: create
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const tag = context.ref.startsWith("refs/tags/") ? context.ref.slice("refs/tags/".length) : `v${version}`;
            // This version's section of CHANGELOG.md becomes "What's new"; the app shows it before updating.
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
            const section = changelog.split(/^## /m).find((s) => s.startsWith(`${version} `) || s.startsWith(`${version}\n`)) ?? "";
            const news = section.split("\n").slice(1).join("\n").trim();
            const body = fs
              .readFileSync(".github/release-notes.md", "utf8")
              .replaceAll("{{version}}", version)
              .replace("{{changes}}", news || "See CHANGELOG.md.");
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `SSHeesh ${version}`,
              body,
              draft: true,
            });
            return data.id;

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            platform: macos-latest
            args: --target universal-apple-darwin
          - name: Windows
            platform: windows-latest
            args: ""
          - name: Linux
            platform: ubuntu-24.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build libraries
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # Every macOS build is signed with the same certificate (SSHeesh's own,
      # self-signed), so macOS sees an update as the same app: Keychain access
      # to saved server passwords ("Always Allow") carries over instead of
      # asking for the Mac's password again after every update. Ad-hoc
      # signatures change with every build. If the certificate is missing or
      # codesign can't use it, the build stays ad-hoc signed, as before.
      - name: Use SSHeesh's signing certificate
        if: matrix.name == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "::warning::No MACOS_SIGNING_CERTIFICATE secret; this build stays ad-hoc signed."
            exit 0
          fi
          kc="$RUNNER_TEMP/ssheesh-signing.keychain-db"
          kc_password=$(uuidgen)
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$kc_password" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_password" "$kc"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_password" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/signing.p12"
          # Try it on a scratch copy before the build relies on it.
          cp /bin/echo "$RUNNER_TEMP/probe"
          if codesign --force --sign "SSHeesh Code Signing" "$RUNNER_TEMP/probe"; then
            echo "APPLE_SIGNING_IDENTITY=SSHeesh Code Signing" >> "$GITHUB_ENV"
          else
            echo "::warning::codesign couldn't use the SSHeesh certificate; this build stays ad-hoc signed."
          fi

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          updaterJsonPreferNsis: true

      # Says in the log which signature the Mac app got.
      - name: Show the macOS signature
        if: matrix.name == 'macOS'
        run: |
          app=$(find target src-tauri/target -path '*/bundle/macos/SSHeesh.app' -prune 2>/dev/null | head -n 1)
          codesign -dv "$app" 2>&1 | grep -E '^(Identifier|Authority|Signature)=' || true
          codesign -d -r- "$app" 2>&1 | grep designated || true

      # Signed with the update key, so the portable app can update itself
      # and check the new file the same way installed apps do.
      - name: Sign the portable Windows app
        if: matrix.name == 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for exe in target/release/ssheesh.exe src-tauri/target/release/ssheesh.exe; do
            [ -f "$exe" ] && break
          done
          npx tauri signer sign "$exe"

      # The same app as one file to run without installing.
      - name: Attach the portable Windows app
        if: matrix.name == 'Windows'
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require("fs");
            const exe = ["target/release/ssheesh.exe", "src-tauri/target/release/ssheesh.exe"].find((p) => fs.existsSync(p));
            if (!exe) throw new Error("Couldn't find the built ssheesh.exe");
            const upload = (path, name) =>
              github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: Number(process.env.RELEASE_ID),
                name,
                data: fs.readFileSync(path),
                headers: { "content-type": "application/octet-stream", "content-length": fs.statSync(path).size },
              });
            // Just "SSHeesh.exe": it's the file people keep and run, and its
            // updates keep whatever name it has.
            await upload(exe, "SSHeesh.exe");
            // Read by the publish job, which puts it into latest.json.
            await upload(`${exe}.sig`, "SSHeesh.exe.sig");

  publish-release:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            const { owner, repo } = context.repo;
            let assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id });
            // The portable app updates itself from its own entry in latest.json. Added
            // here, after every build, so no build job's own latest.json upload can drop it.
            const exe = assets.find((a) => a.name === "SSHeesh.exe");
            const sig = assets.find((a) => a.name === "SSHeesh.exe.sig");
            const manifest = assets.find((a) => a.name === "latest.json");
            if (exe && sig && manifest) {
              const read = async (a) => {
                const { data } = await github.request("GET /repos/{owner}/{repo}/releases/assets/{asset_id}", {
                  owner, repo, asset_id: a.id, headers: { accept: "application/octet-stream" },
                });
                return Buffer.from(data).toString("utf8");
              };
              const latest = JSON.parse(await read(manifest));
              // The API address, like the other entries: unlike a draft's download
              // link it stays the same once the release is published.
              latest.platforms["windows-x86_64-portable"] = { signature: (await read(sig)).trim(), url: exe.url };
              const body = JSON.stringify(latest, null, 2);
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: manifest.id });
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id, name: "latest.json", data: body,
                headers: { "content-type": "application/json", "content-length": Buffer.byteLength(body) },
              });
              assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id });
            }
            // Signatures are already inside latest.json; one file per system is enough.
            for (const a of assets.filter((a) => a.name.endsWith(".sig"))) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
            }
            await github.rest.repos.updateRelease({ owner, repo, release_id, draft: false });
