name: Canary

# Test builds of 1.0, the app on Rune in desktop/. Runs for the canary branch only. Nothing here
# makes a release, touches latest.json or reaches anyone on 0.10: the builds are files to
# download from this run's page.
#
# Test builds update themselves from the `canary` pre-release's canary.json (desktop/app/src/
# update.rs). The archives are signed with a canary key of their own, never 0.10's updater key,
# from two repository secrets:
#   CANARY_SIGNING_KEY           the private key file's contents (`tauri signer generate`)
#   CANARY_SIGNING_KEY_PASSWORD  its password
# Made once, on your own computer:
#   npx @tauri-apps/cli@2.12.4 signer generate -w ~/.tauri/ssheesh-canary.key
#   gh secret set CANARY_SIGNING_KEY < ~/.tauri/ssheesh-canary.key
#   gh secret set CANARY_SIGNING_KEY_PASSWORD        (asks for it)
# and the public key (~/.tauri/ssheesh-canary.key.pub, one line) goes into CANARY_PUBLIC_KEY in
# desktop/app/src/update.rs. Without the secrets the archives and canary.json are published
# unsigned, and test builds only offer the download page.
on:
  push:
    branches: [canary]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            ext: ""
          - name: Windows
            os: windows-latest
            ext: .exe
          - name: macOS
            os: macos-latest
            ext: ""
    defaults:
      run:
        shell: bash
    steps:
      # The fixtures keep the web views' own folder layout, which runs close to Windows' 260 characters.
      - name: Let git write long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@v7

      - name: Install Linux libraries and a software Vulkan driver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libdbus-1-dev pkg-config libvulkan1 mesa-vulkan-drivers tmux

      # desktop/rust-toolchain.toml names the toolchain.
      - name: Install Rust
        working-directory: desktop
        run: rustup toolchain install || rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> ../target/desktop

      - name: Make Rune with our fixes
        run: sh scripts/vendor-rune.sh

      - name: Check the 1.0 workspace against the 0.10 one
        if: runner.os == 'Linux'
        run: sh scripts/check-desktop-workspace.sh

      - name: Test the terminal, the app state and the core
        if: runner.os == 'Linux'
        run: cargo test -p sshee-core -p sshee-term -p sshee-app -p saturating-time

      - name: Test the 1.0 window without a screen
        working-directory: desktop
        run: cargo test --workspace

      # The terminal prototype (one window, one pane, for measuring) and SSHeesh Preview (the
      # 1.0 window: tabs for every server, the sidebar, the status bar).
      # The build knows its commit and, when it's published from the canary branch, its run:
      # what it compares canary.json with (desktop/app/build.rs). Only this step sets them, so the
      # tests above build nothing that would look for updates.
      - name: Build the prototype and SSHeesh Preview
        working-directory: desktop
        env:
          SSHEESH_BUILD_SHA: ${{ github.sha }}
          SSHEESH_CANARY_RUN: ${{ github.ref == 'refs/heads/canary' && github.run_number || '' }}
        run: cargo build --profile perf -p ssheesh-proto -p ssheesh-preview

      - name: Collect the files
        run: |
          mkdir -p out preview
          cp "target/desktop/perf/ssheesh-proto${{ matrix.ext }}" out/
          cp -r desktop/kit out/kit
          cp "target/desktop/perf/ssheesh-preview${{ matrix.ext }}" preview/
          ls -la out preview

      - uses: actions/upload-artifact@v4
        with:
          name: ssheesh-proto-${{ matrix.name }}
          path: out
          retention-days: 14

      # Its own folder (~/.sshee-preview) and keychain name: it runs beside 0.10 and touches
      # nothing of it. `--demo` starts it on made-up servers without connecting anywhere.
      - uses: actions/upload-artifact@v4
        with:
          name: ssheesh-preview-${{ matrix.name }}
          path: preview
          retention-days: 14

  # One pre-release named "SSHeesh 1.0.0 canary" under the tag `canary`, replaced by every
  # green push. The tag doesn't start with `v`, so release.yml never runs for it, and a
  # pre-release is never GitHub's "latest": 0.10's updater (releases/latest/download/latest.json)
  # and the README's download link keep pointing at 0.10.
  publish:
    name: Pre-release for testing
    needs: build
    if: github.ref == 'refs/heads/canary'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ssheesh-preview-*
          path: dl

      # Artifacts lose the executable bit; tar keeps it for Linux and macOS.
      - name: Pack each system's build
        run: |
          mkdir -p up
          chmod +x dl/ssheesh-preview-Linux/ssheesh-preview dl/ssheesh-preview-macOS/ssheesh-preview
          tar -C dl/ssheesh-preview-Linux -czf up/ssheesh-1.0.0-canary-linux-x64.tar.gz ssheesh-preview
          tar -C dl/ssheesh-preview-macOS -czf up/ssheesh-1.0.0-canary-macos-arm64.tar.gz ssheesh-preview
          (cd dl/ssheesh-preview-Windows && zip -q ../../up/ssheesh-1.0.0-canary-windows-x64.zip ssheesh-preview.exe)
          ls -la up

      # canary.json: the version (by this run's number), the commit, and each archive's address,
      # size, SHA-256 and minisign signature. Each archive is signed under a name that carries
      # the version (ssheesh-1.0.0-canary.<run>-linux-x64.tar.gz), which the signature's trusted
      # comment says, so a signature can't be moved onto another build. With no key the
      # signatures are empty and the app only offers the download page.
      - name: Sign the archives and write canary.json
        env:
          CANARY_SIGNING_KEY: ${{ secrets.CANARY_SIGNING_KEY }}
          CANARY_SIGNING_KEY_PASSWORD: ${{ secrets.CANARY_SIGNING_KEY_PASSWORD }}
          RUN: ${{ github.run_number }}
        run: |
          version="1.0.0-canary.$RUN"
          mkdir -p sign
          for platform in linux-x64 macos-arm64 windows-x64; do
            file=$(cd up && ls ssheesh-1.0.0-canary-$platform.*)
            ext=${file#ssheesh-1.0.0-canary-$platform.}
            named="sign/ssheesh-$version-$platform.$ext"
            cp "up/$file" "$named"
            if [ -n "$CANARY_SIGNING_KEY" ]; then
              TAURI_SIGNING_PRIVATE_KEY="$CANARY_SIGNING_KEY" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$CANARY_SIGNING_KEY_PASSWORD" \
                npx --yes @tauri-apps/cli@2.12.4 signer sign "$named" > /dev/null
              test -s "$named.sig"
            fi
          done
          if [ -z "$CANARY_SIGNING_KEY" ]; then
            echo "::warning::No CANARY_SIGNING_KEY secret: canary.json goes out unsigned, and test builds won't install it by themselves."
          fi
          python3 - "$version" "${GITHUB_SHA::7}" "$GITHUB_REPOSITORY" <<'PY'
          import datetime, hashlib, json, os, sys
          version, sha, repo = sys.argv[1:4]
          platforms = {}
          for platform in ("linux-x64", "macos-arm64", "windows-x64"):
              [file] = [f for f in os.listdir("up") if f.startswith(f"ssheesh-1.0.0-canary-{platform}.")]
              data = open(f"up/{file}", "rb").read()
              ext = file[len(f"ssheesh-1.0.0-canary-{platform}."):]
              sig = f"sign/ssheesh-{version}-{platform}.{ext}.sig"
              platforms[platform] = {
                  "url": f"https://github.com/{repo}/releases/download/canary/{file}",
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "signature": open(sig).read().strip() if os.path.exists(sig) else "",
              }
          manifest = {
              "version": version,
              "sha": sha,
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          json.dump(manifest, open("up/canary.json", "w"), indent=2)
          PY
          cat up/canary.json

      - name: Replace the canary pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          short="${GITHUB_SHA::7}"
          cat > notes.md <<NOTES
          A test build of SSHeesh 1.0, the app rewritten in Rust. Built from \`$short\` (run ${{ github.run_number }}). It is replaced by every new canary build, and a test build from here looks for the next one by itself (Settings → Updates → Check for test builds).

          It keeps its own folder (\`~/.sshee-preview\`) and its own keychain entries, so it runs beside 0.10 and changes nothing of it. To try it without any real server, start it with \`--demo\`.

          **Windows:** unzip and run \`ssheesh-preview.exe\`. The build is not signed yet: on the blue SmartScreen window choose "More info", then "Run anyway".

          **macOS (Apple Silicon):** \`tar xzf ssheesh-1.0.0-canary-macos-arm64.tar.gz\`, then \`xattr -d com.apple.quarantine ssheesh-preview\` and \`./ssheesh-preview\`.

          **Linux (x64):** \`tar xzf ssheesh-1.0.0-canary-linux-x64.tar.gz && ./ssheesh-preview\`. It needs Vulkan (Mesa's driver works).
          NOTES
          gh release delete canary --yes --cleanup-tag || true
          gh release create canary up/* \
            --target "$GITHUB_SHA" \
            --title "SSHeesh 1.0.0 canary ($short)" \
            --notes-file notes.md \
            --prerelease --latest=false
