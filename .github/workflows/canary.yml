name: Canary

# Test builds of 1.0, the app on Rune in desktop/. Runs for the canary branch only. Nothing here
# makes a release, touches latest.json or reaches anyone on 0.10: the builds are files to
# download from this run's page.
on:
  push:
    branches: [canary]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            ext: ""
          - name: Windows
            os: windows-latest
            ext: .exe
          - name: macOS
            os: macos-latest
            ext: ""
    defaults:
      run:
        shell: bash
    steps:
      # The fixtures keep the web views' own folder layout, which runs close to Windows' 260 characters.
      - name: Let git write long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@v7

      - name: Install Linux libraries and a software Vulkan driver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libdbus-1-dev pkg-config libvulkan1 mesa-vulkan-drivers tmux

      # desktop/rust-toolchain.toml names the toolchain.
      - name: Install Rust
        working-directory: desktop
        run: rustup toolchain install || rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> ../target/desktop

      - name: Make Rune with our fixes
        run: sh scripts/vendor-rune.sh

      - name: Check the 1.0 workspace against the 0.10 one
        if: runner.os == 'Linux'
        run: sh scripts/check-desktop-workspace.sh

      - name: Test the terminal, the app state and the core
        if: runner.os == 'Linux'
        run: cargo test -p sshee-core -p sshee-term -p sshee-app -p saturating-time

      - name: Test the 1.0 window without a screen
        working-directory: desktop
        run: cargo test --workspace

      # The terminal prototype (one window, one pane, for measuring) and SSHeesh Preview (the
      # 1.0 window: tabs for every server, the sidebar, the status bar).
      - name: Build the prototype and SSHeesh Preview
        working-directory: desktop
        run: cargo build --profile perf -p ssheesh-proto -p ssheesh-preview

      - name: Collect the files
        run: |
          mkdir -p out preview
          cp "target/desktop/perf/ssheesh-proto${{ matrix.ext }}" out/
          cp -r desktop/kit out/kit
          cp "target/desktop/perf/ssheesh-preview${{ matrix.ext }}" preview/
          ls -la out preview

      - uses: actions/upload-artifact@v4
        with:
          name: ssheesh-proto-${{ matrix.name }}
          path: out
          retention-days: 14

      # Its own folder (~/.sshee-preview) and keychain name: it runs beside 0.10 and touches
      # nothing of it. `--demo` starts it on made-up servers without connecting anywhere.
      - uses: actions/upload-artifact@v4
        with:
          name: ssheesh-preview-${{ matrix.name }}
          path: preview
          retention-days: 14

  # One pre-release named "SSHeesh 1.0.0 canary" under the tag `canary`, replaced by every
  # green push. The tag doesn't start with `v`, so release.yml never runs for it, and a
  # pre-release is never GitHub's "latest": 0.10's updater (releases/latest/download/latest.json)
  # and the README's download link keep pointing at 0.10.
  publish:
    name: Pre-release for testing
    needs: build
    if: github.ref == 'refs/heads/canary'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ssheesh-preview-*
          path: dl

      # Artifacts lose the executable bit; tar keeps it for Linux and macOS.
      - name: Pack each system's build
        run: |
          mkdir -p up
          chmod +x dl/ssheesh-preview-Linux/ssheesh-preview dl/ssheesh-preview-macOS/ssheesh-preview
          tar -C dl/ssheesh-preview-Linux -czf up/ssheesh-1.0.0-canary-linux-x64.tar.gz ssheesh-preview
          tar -C dl/ssheesh-preview-macOS -czf up/ssheesh-1.0.0-canary-macos-arm64.tar.gz ssheesh-preview
          (cd dl/ssheesh-preview-Windows && zip -q ../../up/ssheesh-1.0.0-canary-windows-x64.zip ssheesh-preview.exe)
          ls -la up

      - name: Replace the canary pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          short="${GITHUB_SHA::7}"
          cat > notes.md <<NOTES
          A test build of SSHeesh 1.0, the app rewritten in Rust. Built from \`$short\` (run ${{ github.run_number }}). It is replaced by every new canary build; nothing here updates itself yet.

          It keeps its own folder (\`~/.sshee-preview\`) and its own keychain entries, so it runs beside 0.10 and changes nothing of it. To try it without any real server, start it with \`--demo\`.

          **Windows:** unzip and run \`ssheesh-preview.exe\`. The build is not signed yet: on the blue SmartScreen window choose "More info", then "Run anyway".

          **macOS (Apple Silicon):** \`tar xzf ssheesh-1.0.0-canary-macos-arm64.tar.gz\`, then \`xattr -d com.apple.quarantine ssheesh-preview\` and \`./ssheesh-preview\`.

          **Linux (x64):** \`tar xzf ssheesh-1.0.0-canary-linux-x64.tar.gz && ./ssheesh-preview\`. It needs Vulkan (Mesa's driver works).
          NOTES
          gh release delete canary --yes --cleanup-tag || true
          gh release create canary up/* \
            --target "$GITHUB_SHA" \
            --title "SSHeesh 1.0.0 canary ($short)" \
            --notes-file notes.md \
            --prerelease --latest=false
